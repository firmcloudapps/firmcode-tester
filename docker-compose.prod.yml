services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKERHUB_NAMESPACE}/firmcode-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DRY_RUN: ${DRY_RUN:-true}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      REVIEW_SKIP_DRAFT_PRS: ${REVIEW_SKIP_DRAFT_PRS:-true}
      REVIEW_LARGE_PR_MAX_CHANGED_FILES: ${REVIEW_LARGE_PR_MAX_CHANGED_FILES:-100}
      REVIEW_LARGE_PR_MAX_DIFF_BYTES: ${REVIEW_LARGE_PR_MAX_DIFF_BYTES:-500000}
      REVIEW_LARGE_PR_MAX_CHANGED_LINES: ${REVIEW_LARGE_PR_MAX_CHANGED_LINES:-4000}
      REVIEW_LARGE_PR_MAX_ESTIMATED_TOKENS: ${REVIEW_LARGE_PR_MAX_ESTIMATED_TOKENS:-40000}
      REVIEW_LARGE_PR_MAX_FILTERED_FILES: ${REVIEW_LARGE_PR_MAX_FILTERED_FILES:-50}
      REVIEW_LARGE_PR_MAX_SEMGREP_RUNTIME_MS: ${REVIEW_LARGE_PR_MAX_SEMGREP_RUNTIME_MS:-30000}
      REVIEW_SUMMARY_ONLY_DIFF_BYTES: ${REVIEW_SUMMARY_ONLY_DIFF_BYTES:-1200000}
      REVIEW_SUMMARY_ONLY_CHANGED_LINES: ${REVIEW_SUMMARY_ONLY_CHANGED_LINES:-10000}
      REVIEW_SUMMARY_ONLY_ESTIMATED_TOKENS: ${REVIEW_SUMMARY_ONLY_ESTIMATED_TOKENS:-100000}
      REVIEW_LARGE_PR_MAX_FULL_CONTEXT_FILES: ${REVIEW_LARGE_PR_MAX_FULL_CONTEXT_FILES:-25}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 10

  worker:
    image: ${DOCKERHUB_NAMESPACE}/firmcode-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      REVIEW_QUEUE_NAME: ${REVIEW_QUEUE_NAME:-review-runs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DRY_RUN: ${DRY_RUN:-true}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      SEMGREP_CONFIGS: ${SEMGREP_CONFIGS:-auto,infra/semgrep}
      SEMGREP_TIMEOUT_MS: ${SEMGREP_TIMEOUT_MS:-30000}
      TREESITTER_TIMEOUT_MS: ${TREESITTER_TIMEOUT_MS:-5000}
      TREESITTER_MAX_FILE_BYTES: ${TREESITTER_MAX_FILE_BYTES:-500000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "firmcode_worker.runtime", "--check"]
      interval: 30s
      timeout: 15s
      retries: 5

volumes:
  redis_data:
