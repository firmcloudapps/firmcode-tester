services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.prod.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      APP_URL: ${APP_URL:?Set APP_URL to the production dashboard URL}
      API_URL: ${API_URL:?Set API_URL to the production API URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to the dashboard origin}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your NeonDB connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DRY_RUN: ${DRY_RUN:-true}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?Set GITHUB_APP_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET}
      REVIEW_SKIP_DRAFT_PRS: ${REVIEW_SKIP_DRAFT_PRS:-true}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.prod.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your NeonDB connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      REVIEW_QUEUE_NAME: ${REVIEW_QUEUE_NAME:-review-runs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DRY_RUN: ${DRY_RUN:-true}
      SEMGREP_CONFIGS: ${SEMGREP_CONFIGS:-auto,infra/semgrep}
      SEMGREP_TIMEOUT_MS: ${SEMGREP_TIMEOUT_MS:-30000}
      TREESITTER_TIMEOUT_MS: ${TREESITTER_TIMEOUT_MS:-5000}
      TREESITTER_MAX_FILE_BYTES: ${TREESITTER_MAX_FILE_BYTES:-500000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "firmcode_worker.runtime", "--check"]
      interval: 30s
      timeout: 15s
      retries: 5

volumes:
  redis_data:
