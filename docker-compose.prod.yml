services:
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: obehiaye/firmcode-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 10

  worker:
    image: obehiaye/firmcode-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      REVIEW_QUEUE_NAME: review-runs
      SEMGREP_STARTUP_TIMEOUT_SECONDS: ${SEMGREP_STARTUP_TIMEOUT_SECONDS:-30}
      SEMGREP_STARTUP_VERSION_CHECK: ${SEMGREP_STARTUP_VERSION_CHECK:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-m", "firmcode_worker.runtime", "--check" ]
      interval: 30s
      timeout: 15s
      retries: 5

volumes:
  redis_data:
