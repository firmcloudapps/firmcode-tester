services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3001"
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your NeonDB connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_local_placeholder}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-whsec_local_placeholder}
      LOG_LEVEL: info
      DRY_RUN: "true"
      GITHUB_APP_ID: ${GITHUB_APP_ID:-12345}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpsb2NhbF9wbGFjZWhvbGRlcgotLS0tLUVORCBSU0EgUFJJVkFURSBLRVktLS0tLQ==}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-github_webhook_local_placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github_client_id_local_placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github_client_secret_local_placeholder}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your NeonDB connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      DRY_RUN: "true"
      SEMGREP_CONFIGS: auto,infra/semgrep
      SEMGREP_STARTUP_TIMEOUT_SECONDS: "30"
      SEMGREP_STARTUP_VERSION_CHECK: "false"
      TREESITTER_TIMEOUT_MS: "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "firmcode_worker.runtime", "--check"]
      interval: 30s
      timeout: 15s
      retries: 5

volumes:
  redis_data:
