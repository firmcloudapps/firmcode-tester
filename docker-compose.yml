services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${WEB_NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_DASHBOARD_URL: ${WEB_NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-insforge}
        NEXT_PUBLIC_INSFORGE_BASE_URL: ${NEXT_PUBLIC_INSFORGE_BASE_URL:-${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}}
        NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL:-${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}}
        NEXT_PUBLIC_INSFORGE_ANON_KEY: ${NEXT_PUBLIC_INSFORGE_ANON_KEY:-${INSFORGE_ANON_KEY:-}}
        INSFORGE_BASE_URL: ${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}
        INSFORGE_ANON_KEY: ${INSFORGE_ANON_KEY:-}
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${WEB_NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_DASHBOARD_URL: ${WEB_NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-insforge}
      NEXT_PUBLIC_INSFORGE_BASE_URL: ${NEXT_PUBLIC_INSFORGE_BASE_URL:-${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}}
      NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL:-${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${NEXT_PUBLIC_INSFORGE_ANON_KEY:-${INSFORGE_ANON_KEY:-}}
      INSFORGE_BASE_URL: ${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}
      INSFORGE_ANON_KEY: ${INSFORGE_ANON_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/sign-in').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: "3001"
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Database Provider: 'neon' (default) or 'insforge'
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-neon}
      DATABASE_URL: ${DATABASE_URL:-postgresql://placeholder@localhost/firmcode}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      # InsForge Database (when DATABASE_PROVIDER=insforge)
      INSFORGE_DATABASE_URL: ${INSFORGE_DATABASE_URL:-}
      INSFORGE_BASE_URL: ${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}
      INSFORGE_SERVICE_KEY: ${INSFORGE_SERVICE_KEY:-}
      REDIS_URL: redis://redis:6379
      AUTH_PROVIDER: ${AUTH_PROVIDER:-insforge}
      # Storage Provider: 'database' (default) or 'insforge'
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-database}
      INSFORGE_STORAGE_BUCKET: ${INSFORGE_STORAGE_BUCKET:-review-artifacts}
      LOG_LEVEL: info
      DRY_RUN: "true"
      GITHUB_APP_ID: ${GITHUB_APP_ID:-12345}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpsb2NhbF9wbGFjZWhvbGRlcgotLS0tLUVORCBSU0EgUFJJVkFURSBLRVktLS0tLQ==}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-github_webhook_local_placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github_client_id_local_placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github_client_secret_local_placeholder}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      # Database Provider: 'neon' (default) or 'insforge'
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-neon}
      DATABASE_URL: ${DATABASE_URL:-postgresql://placeholder@localhost/firmcode}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      # InsForge Database (when DATABASE_PROVIDER=insforge)
      INSFORGE_DATABASE_URL: ${INSFORGE_DATABASE_URL:-}
      INSFORGE_BASE_URL: ${INSFORGE_BASE_URL:-https://h35yzuga.eu-central.insforge.app}
      REDIS_URL: redis://redis:6379
      # Storage Provider: 'database' (default) or 'insforge'
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-database}
      INSFORGE_STORAGE_BUCKET: ${INSFORGE_STORAGE_BUCKET:-review-artifacts}
      LOG_LEVEL: info
      DRY_RUN: "true"
      GITHUB_APP_ID: ${GITHUB_APP_ID:-12345}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpsb2NhbF9wbGFjZWhvbGRlcgotLS0tLUVORCBSU0EgUFJJVkFURSBLRVktLS0tLQ==}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-github_webhook_local_placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github_client_id_local_placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github_client_secret_local_placeholder}
      SEMGREP_CONFIGS: infra/semgrep/config.yml
      SEMGREP_STARTUP_TIMEOUT_SECONDS: "30"
      SEMGREP_STARTUP_VERSION_CHECK: "false"
      TREESITTER_TIMEOUT_MS: "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "firmcode_worker.runtime", "--check"]
      interval: 30s
      timeout: 15s
      retries: 5

volumes:
  redis_data:
