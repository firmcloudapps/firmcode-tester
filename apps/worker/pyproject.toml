[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmcode-worker"
version = "0.1.0"
description = "Python worker package for Firmcode review pipeline stages."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
firmcode-worker = "firmcode_worker.runtime:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["firmcode_worker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
