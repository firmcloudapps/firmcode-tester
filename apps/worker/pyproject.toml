[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmcode-worker"
version = "0.1.0"
description = "Python worker package for Firmcode review pipeline stages."
requires-python = ">=3.9"
dependencies = [
  "bullmq>=2.19.0",
  "psycopg[binary]>=3.2.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-yaml>=0.7.0"
]

[project.scripts]
firmcode-worker = "firmcode_worker.runtime:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["firmcode_worker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
